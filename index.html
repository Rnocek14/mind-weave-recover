<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroRecover - Speech Therapy for Stroke Recovery</title>
    <!-- Speech/language only — the app has no motor rehab, so don't promise it. -->
    <meta name="description" content="Personalized speech and language therapy for stroke recovery. Rebuild word finding, conversation, and confidence from home with adaptive daily practice." />
    <meta name="author" content="NeuroRecover" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1173C9" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NeuroRecover" />

    <meta property="og:title" content="NeuroRecover - Speech Therapy for Stroke Recovery" />
    <meta property="og:description" content="Rebuild word finding, conversation, and confidence from home with adaptive daily speech practice." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://neurospark.co/" />
    <meta property="og:site_name" content="NeuroRecover" />
    <link rel="canonical" href="https://neurospark.co/" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
