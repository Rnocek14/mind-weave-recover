# Build on main; publication is opt-in and requires same-revision verification.
# This governs GitHub Pages only. Lovable/manual/other deployment routes must
# be separately restricted before claiming there is no release bypass.
name: Site artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://neurospark.co
  CUSTOM_DOMAIN: neurospark.co

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for prerendering
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Custom domain
        run: echo "${CUSTOM_DOMAIN}" > dist/CNAME
      - name: Verify the artifact before publishing
        run: node scripts/verify-dist.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  regression:
    name: Release regression verification
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  therapy:
    name: Release isolated speech and persistence verification
    needs: regression
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true')
    uses: ./.github/workflows/therapy-e2e.yml
    permissions:
      contents: read
    secrets:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}

  release-gate:
    name: Release gate
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true')
    needs: [build, regression, therapy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Refuse publishing without all required verification
        env:
          QA_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/qa-gates.mjs build regression therapy

  publish:
    name: Publish to GitHub Pages
    needs: [build, release-gate]
    if: github.ref == 'refs/heads/main' && needs.release-gate.result == 'success' && (github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
