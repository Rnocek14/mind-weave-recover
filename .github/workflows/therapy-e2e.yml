name: Isolated therapy verification

# Protected environment must point to a verified synthetic-only test backend.
# A missing credential or skipped case blocks this workflow; never use production.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      E2E_SUPABASE_URL:
        required: true
      E2E_SUPABASE_PUBLISHABLE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: therapy-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  therapy:
    name: Required authenticated therapy journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: neurospark-e2e
    env:
      CI: 'true'
      E2E_SUITE: staging
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate isolated environment before network tests
        run: bun run test:e2e:check-env && bun run test:speech:services:check-env
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Run every selected authenticated journey without skips
        run: bun run test:e2e:staging
      - name: Verify deployed speech services with bounded synthetic recordings
        run: bun run test:speech:services
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-therapy-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
