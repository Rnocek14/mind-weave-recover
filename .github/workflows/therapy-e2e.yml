name: Isolated therapy verification

# Requires an isolated project with this repo's schema and anonymous auth enabled.
# Public CI remains useful without these credentials; a public run is not a
# completed release check. Run this required therapy check before release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: therapy-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  therapy:
    name: Required authenticated therapy journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: neurospark-e2e
    env:
      CI: 'true'
      E2E_SUITE: staging
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate isolated environment before installs or network tests
        run: node --input-type=module -e "import { resolveE2EEnvironment } from './scripts/e2e-environment.mjs'; resolveE2EEnvironment();"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Run every authenticated journey without skips
        run: bun run test:e2e:staging
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-therapy-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
