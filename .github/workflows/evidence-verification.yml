name: Evidence and production bundle

# Invoked by CI so the production build is part of its aggregate gate.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-build:
    name: Evidence regression suite and production bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run complete unit suite and reject incomplete evidence
        shell: bash
        run: |
          status=0
          bun run test > /tmp/evidence-tests.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 100 /tmp/evidence-tests.log
          else
            tail -n 12 /tmp/evidence-tests.log
          fi
          exit "$status"
      - name: Build production bundle without deployment or live prerendering
        shell: bash
        run: |
          status=0
          bunx vite build > /tmp/evidence-build.log 2>&1 || status=$?
          tail -n 25 /tmp/evidence-build.log
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -s dist/index.html
          echo 'Production bundle built. No deploy, live verification or prerender was run.'
      - name: Retain individual unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-evidence
          path: evidence-test-results.json
          retention-days: 7
