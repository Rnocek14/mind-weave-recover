name: Apply verified audit batch 2

on:
  pull_request:
    paths:
      - scripts/audit-batch2-repair.mjs
      - .github/workflows/audit-batch2-apply.yml

permissions:
  contents: read

concurrency:
  group: audit-batch2-apply-51
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'Rnocek14/mind-weave-recover' &&
      github.event.pull_request.number == 51 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == 'Rnocek14/mind-weave-recover' &&
      github.event.pull_request.head.ref == 'fix/audit-evidence-integrity-2026-09-29'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Validate branch head and transform pinned sources
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          branch='fix/audit-evidence-integrity-2026-09-29'
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          node scripts/audit-batch2-repair.mjs
          git diff --check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify targeted regressions before committing
        run: bunx vitest run src/hooks/__tests__/auditAttemptPersistence.test.ts src/hooks/__tests__/auditCapturedAttempt.test.tsx src/lib/clinical/__tests__/practiceObservations.test.ts
      - name: Verify real TypeScript projects
        run: bunx tsc --noEmit -p tsconfig.app.json && bunx tsc --noEmit -p tsconfig.node.json
      - name: Commit only the three reviewed files to the repair branch
        run: |
          set -eu
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '3'
          git add -- src/hooks/useUtteranceLogger.ts src/components/PhotoNamingGame.tsx src/components/patient-hub/IntelligenceTab.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: wire captured speech attempts and bound clinician claims'
          git push origin HEAD:refs/heads/fix/audit-evidence-integrity-2026-09-29
