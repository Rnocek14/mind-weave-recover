name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests (incl. leveling contract + content coverage)
        run: bunx vitest run

      - name: Type-check
        run: bunx tsc --noEmit

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Phase 1A scaffolding — runs the public-route smoke spec.
    # Authenticated journeys land in a follow-up PR.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: bunx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
