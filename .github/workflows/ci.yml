name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests (incl. leveling contract + content coverage)
        run: bunx vitest run

      - name: Type-check
        run: bunx tsc --noEmit
